name: Deploy TIPs to Docs

permissions: {}

# Fork: no push-to-main trigger; see test.yml. This fork does not publish TIP docs, so the
# workflow is now workflow_dispatch only.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy to Vercel
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

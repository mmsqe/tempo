name: Scan GitHub Actions

# Fork: no push-to-main trigger; see test.yml. The pull_request trigger below still gates
# every .github/** change, which is where the scan actually blocks a mistake.
on:
  pull_request:
    paths:
      - ".github/**"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/tempo' }}
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@5d3a903b51ce8d1f6d363d1c59d7243ecf80f026
    permissions:
      actions: read
      contents: read
